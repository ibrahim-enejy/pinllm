name: Build Extension & Deploy Web App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Browser Extension (.zip)
        run: |
          cd apps/extension
          zip -r -q ../../apps/web/public/pinllm-extension.zip manifest.json background.js content.js content.css popup.html popup.js

      - name: Upload Browser Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinllm-browser-extension
          path: apps/web/public/pinllm-extension.zip

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "apps/web/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
